<h2>Progress Notes</h2>

<form [formGroup]="progressForm">

  <!-- Project Code -->
  <div>
    <label for="project-code">Project Code:</label>
    <input
      id="project-code"
      type="text"
      formControlName="projectCode"
      placeholder="e.g., PPT101"
      (blur)="updateProjectName()">

    @if (codeMessage) {
      <p>{{ codeMessage }}</p>
    }
  </div>

  <!-- Project Name -->
  <div>
    <label for="project-name">Project Name:</label>
    <input
      id="project-name"
      type="text"
      formControlName="projectName"
      placeholder="Project name">
  </div>

  <!-- Date -->
  <div>
    <label for="date">Date:</label>
    <input
      id="date"
      type="date"
      formControlName="date">
  </div>

  <!-- Current Status -->
  <div>
    <label for="current-status">Current Status:</label>
    <select
      id="current-status"
      formControlName="currentStatus">
      <option value="">Select Status</option>
      <option value="Not Started">Not Started</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <!-- Team Member -->
  <div>
    <label for="team-member">Team Member:</label>
    <input
      id="team-member"
      type="text"
      formControlName="teamMember"
      placeholder="Enter team member name">
  </div>

  <!-- Progress Note -->
  <div>
    <label for="progress-note">Progress Note:</label>
    <textarea
      id="progress-note"
      formControlName="progressNote"
      placeholder="Enter progress notes">
    </textarea>
  </div>

</form>
